<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Reply Settings</title>
  <style>
    body { font-family: sans-serif; width: 300px; padding: 14px; margin: 0; }
    h3 { margin: 0 0 10px; font-size: 15px; }
    p { margin: 0 0 6px; font-size: 13px; }
    a { font-size: 12px; color: #1a73e8; }
    textarea {
      width: 100%; box-sizing: border-box; font-size: 11px;
      font-family: monospace; margin-top: 6px; resize: vertical;
    }
    .buttons { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    button { padding: 6px 12px; cursor: pointer; font-size: 13px; }
    #fetch-btn { background: #1a73e8; color: #fff; border: none; border-radius: 4px; }
    #fetch-btn:disabled { opacity: 0.6; cursor: default; }
    #status { margin-top: 8px; font-size: 12px; min-height: 16px; }
    details { margin-top: 10px; font-size: 12px; }
    summary { cursor: pointer; color: #555; }
  </style>
</head>
<body>
  <h3>AI Reply – Settings</h3>

  <p>1. <a href="http://localhost:8000/api/v1/auth/login" target="_blank">Log in with Google ↗</a></p>
  <p>2. Click below to fetch your token automatically:</p>

  <div class="buttons">
    <button id="fetch-btn">Fetch Token</button>
  </div>

  <details>
    <summary>Paste token manually instead</summary>
    <textarea id="token" rows="4" placeholder="eyJ…"></textarea>
    <div class="buttons">
      <button id="save">Save</button>
      <button id="clear">Clear</button>
    </div>
  </details>

  <div id="status"></div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
