<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AI Email Orchestrator{% endblock %}</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "sans-serif"],
          },
        },
      },
    };
  </script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJt/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBn/mCdtVzcYjlbu9p8nKcNMVw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- SweetAlert2 -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
  />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      font-family: "Inter", sans-serif;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body class="min-h-screen bg-[#F3F4F6] font-sans text-gray-800 antialiased">
  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside
      class="flex w-[250px] shrink-0 flex-col border-r border-gray-200 bg-white shadow-sm"
      aria-label="Điều hướng chính"
    >
      <!-- Logo / Brand -->
      <div class="border-b border-gray-100 px-6 py-8">
        <a href="/" class="group flex items-center gap-3">
          <span
            class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-md shadow-indigo-200 transition group-hover:shadow-lg"
          >
            <i class="fa-solid fa-envelope-open-text text-lg"></i>
          </span>
          <div>
            <p
              class="bg-gradient-to-r from-indigo-600 via-violet-600 to-purple-600 bg-clip-text text-base font-bold leading-tight text-transparent"
            >
              AI Email
            </p>
            <p
              class="bg-gradient-to-r from-indigo-500 to-violet-500 bg-clip-text text-xs font-semibold tracking-wide text-transparent"
            >
              Orchestrator
            </p>
          </div>
        </a>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 space-y-1 px-4 py-6">
        <a
          href="/dashboard"
          class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-gray-600 transition-colors duration-200 hover:bg-indigo-50 hover:text-indigo-700"
        >
          <i class="fa-solid fa-chart-line w-5 text-center text-gray-400 transition-colors group-hover:text-indigo-600"></i>
          <span>Dashboard</span>
        </a>
        <a
          href="/emails"
          class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-gray-600 transition-colors duration-200 hover:bg-indigo-50 hover:text-indigo-700"
        >
          <i class="fa-solid fa-inbox w-5 text-center text-gray-400"></i>
          <span>Emails</span>
        </a>
        <a
          href="/settings"
          class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-gray-600 transition-colors duration-200 hover:bg-indigo-50 hover:text-indigo-700"
        >
          <i class="fa-solid fa-gear w-5 text-center text-gray-400"></i>
          <span>Settings</span>
        </a>
      </nav>

      <!-- Sidebar footer -->
      <div class="border-t border-gray-100 px-6 py-5">
        <p class="text-xs text-gray-400">v1.0 · Multi-Agent</p>
      </div>
    </aside>

    <!-- Main content -->
    <div class="flex min-w-0 flex-1 flex-col">

      <!-- Header -->
      <header
        class="sticky top-0 z-10 flex items-center justify-between border-b border-gray-200 bg-white/90 px-8 py-5 backdrop-blur-sm"
      >
        <div class="flex items-center gap-4">
          <div
            id="header-user-avatar"
            class="flex h-11 w-11 items-center justify-center rounded-full bg-gradient-to-br from-indigo-400 to-violet-500 text-sm font-semibold text-white shadow ring-2 ring-white"
            title="Tài khoản"
          >
            …
          </div>
          <div>
            <p class="text-xs font-medium uppercase tracking-wider text-gray-400">Chào mừng trở lại</p>
            <p id="header-user-greeting" class="text-lg font-semibold text-gray-900">Đang tải…</p>
            <p id="header-user-email" class="text-xs text-gray-500"></p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button
            id="btn-logout"
            type="button"
            class="inline-flex items-center gap-2 rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm font-medium text-gray-600 shadow-sm transition hover:border-red-200 hover:bg-red-50 hover:text-red-600 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-offset-2"
          >
            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            Đăng xuất
          </button>
          <button
            id="btn-scan-emails"
            type="button"
            class="inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 px-5 py-2.5 text-sm font-semibold text-white shadow-md shadow-indigo-200 transition-all duration-200 hover:-translate-y-0.5 hover:from-indigo-700 hover:to-indigo-600 hover:shadow-lg hover:shadow-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
          >
            <span aria-hidden="true">🚀</span>
            Quét Email Mới
          </button>
        </div>
      </header>

      <!-- Dynamic content -->
      <main class="flex-1 overflow-y-auto p-8">
        {% block content %}{% endblock %}
      </main>

    </div>
  </div>

  <script src="/static/js/main.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
