<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — AI Email Orchestrator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
  />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: "Inter", sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-indigo-50/80 to-violet-100">
  <main class="relative flex min-h-screen items-center justify-center px-4 py-12">
  <div
    class="pointer-events-none absolute inset-0 overflow-hidden"
    aria-hidden="true"
  >
    <div class="absolute -left-24 top-1/4 h-72 w-72 rounded-full bg-indigo-200/40 blur-3xl"></div>
    <div class="absolute -right-16 bottom-1/4 h-80 w-80 rounded-full bg-violet-200/50 blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md">
    <!-- Auth error banner -->
    <div
      id="auth-error-banner"
      class="mb-4 hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800 shadow-sm"
      role="alert"
    >
      <div class="flex items-start gap-3">
        <i class="fa-solid fa-circle-exclamation mt-0.5 text-red-500" aria-hidden="true"></i>
        <div>
          <p class="font-semibold">Đăng nhập thất bại</p>
          <p id="auth-error-message" class="mt-1 text-red-700"></p>
        </div>
      </div>
    </div>

    <!-- Form card -->
    <div
      class="rounded-2xl border border-white/60 bg-white/95 p-10 shadow-2xl shadow-indigo-200/40 backdrop-blur-sm"
    >
      <div class="mb-8 text-center">
        <div
          class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-lg shadow-indigo-300/50"
        >
          <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-gray-900">AI Email Orchestrator</h1>
        <p class="mt-2 text-sm leading-relaxed text-gray-500">
          Hệ thống đa tác tử AI — phân loại, soạn thảo và quản lý email thông minh.
        </p>
      </div>

      <a
        id="btn-google-signin"
        href="/api/v1/auth/login"
        class="group flex w-full items-center justify-center gap-3 rounded-xl border border-gray-200 bg-white px-5 py-4 text-base font-semibold text-gray-800 shadow-sm transition-all duration-200 hover:border-indigo-200 hover:bg-indigo-50 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
      >
        <span
          class="flex h-6 w-6 shrink-0 items-center justify-center rounded-sm bg-white"
          aria-hidden="true"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
        </span>
        Sign in with Google
      </a>

      <p class="mt-6 text-center text-xs text-gray-400">
        Cần quyền truy cập Gmail để quét và soạn thảo email.
      </p>
    </div>

    <p class="mt-6 text-center text-xs text-gray-400">© AI Email Orchestrator</p>
  </div>
  </main>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <script>
    const AUTH_ERROR_MESSAGES = {
      session_expired: "Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.",
      unauthorized: "Bạn cần đăng nhập để tiếp tục.",
      oauth_failed: "Xác thực Google thất bại. Vui lòng thử lại.",
      default: "Có lỗi xác thực. Vui lòng thử đăng nhập lại.",
    };

    function showLoginAuthError(message) {
      const banner = document.getElementById("auth-error-banner");
      const messageEl = document.getElementById("auth-error-message");
      if (!banner || !messageEl) return;
      messageEl.textContent = message;
      banner.classList.remove("hidden");
    }

    function initLoginPage() {
      const params = new URLSearchParams(window.location.search);
      const errorCode = params.get("error");
      const errorDetail = params.get("message");

      if (errorCode || errorDetail) {
        const message =
          errorDetail ||
          AUTH_ERROR_MESSAGES[errorCode] ||
          AUTH_ERROR_MESSAGES.default;
        showLoginAuthError(message);
        if (typeof Swal !== "undefined") {
          Swal.fire({
            icon: "error",
            title: "Lỗi đăng nhập",
            text: message,
            confirmButtonColor: "#4f46e5",
          });
        }
      }
    }

    document.addEventListener("DOMContentLoaded", initLoginPage);
  </script>
</body>
</html>
